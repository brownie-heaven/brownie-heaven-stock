<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Brownie Heaven — Stock</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brown:#6B2400;--brown2:#8B3A00;--brown-pale:#FFF3EE;--brown-border:#F5D5C8;
  --green:#2D6A2D;--green-pale:#EAF3DE;

  --txt:#1A1208;--txt2:#6B5C4E;--txt3:#A0917F;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --radius:12px;--radius-sm:8px;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--txt);font-size:14px}
.app{min-height:100vh;display:flex;flex-direction:column}
.hdr{background:var(--brown);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;flex-shrink:0}
.hdr-left{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--brown);flex-shrink:0}
.hdr-title{color:#fff;font-size:15px;font-weight:600;line-height:1.2}
.hdr-sub{color:rgba(255,255,255,0.65);font-size:11px}
.hdr-right{display:flex;gap:6px;align-items:center}
.hdr-btn{background:rgba(255,255,255,0.18);border:none;color:#fff;padding:6px 11px;border-radius:20px;font-size:12px;cursor:pointer;font-family:var(--font);white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,0.28)}
.logout-btn{background:rgba(255,80,50,0.35);border:none;color:#fff;padding:6px 11px;border-radius:20px;font-size:12px;cursor:pointer;font-family:var(--font)}
.logout-btn:hover{background:rgba(255,80,50,0.5)}
.main-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:100;flex-shrink:0}
.mt{flex:1;padding:11px 4px;border:none;background:transparent;font-size:11px;font-weight:500;color:var(--txt3);cursor:pointer;font-family:var(--font);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.mt.active{color:var(--brown);border-bottom-color:var(--brown)}
.screen{padding:14px;max-width:700px;width:100%;margin:0 auto;flex:1}
.loading{display:flex;align-items:center;justify-content:center;padding:60px 20px;flex-direction:column;gap:12px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--brown);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.pin-wrap{max-width:260px;margin:20px auto 0}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:18px 0}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:all .15s}
.pin-dot.filled{background:var(--brown);border-color:var(--brown)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nb{padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--txt);font-size:18px;font-weight:500;cursor:pointer;font-family:var(--font);transition:background .1s;text-align:center}
.nb:active{background:var(--bg)}
.nb.del{font-size:13px;color:var(--txt3)}
.shift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.shift-btn{padding:11px 6px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--txt);font-size:12px;cursor:pointer;text-align:center;font-family:var(--font);line-height:1.4;transition:all .15s}
.shift-btn .st{font-size:10px;color:var(--txt3);margin-top:2px}
.shift-btn.sel{border:2px solid var(--brown);background:var(--brown-pale);color:var(--brown)}
.shift-btn.sel .st{color:var(--brown)}
.outlet-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;background:var(--brown-pale);color:var(--brown);border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--brown-border);margin-bottom:12px}
.field{margin-bottom:11px}
.field label{font-size:12px;color:var(--txt2);display:block;margin-bottom:4px;font-weight:500}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--card);color:var(--txt);font-family:var(--font)}
.field input:focus,.field select:focus{outline:none;border-color:var(--brown)}
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;background:var(--card);color:var(--txt2);font-family:var(--font);font-weight:500;transition:all .15s;flex-shrink:0}
.tab.active{background:var(--brown);color:#fff;border-color:var(--brown)}
.prod-row{border-bottom:1px solid var(--border2);padding:10px 0}
.prod-row:last-child{border-bottom:none}
.prod-name{font-size:13px;font-weight:500;color:var(--txt);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.prod-price{font-size:10px;color:var(--txt3);font-family:var(--mono)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.fg{text-align:center}
.fg label{font-size:9px;color:var(--txt3);display:block;margin-bottom:2px;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.fg input{width:100%;padding:5px 2px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:center;background:var(--card);color:var(--txt);font-family:var(--font)}
.fg input:focus{outline:none;border-color:var(--brown)}
.fg input.ro{background:var(--bg);color:var(--txt2)}
.fg input.cl{background:var(--brown-pale);border-color:var(--brown-border);color:var(--brown);font-weight:600}
.sales-lbl{font-size:10px;color:var(--txt3);margin:6px 0 3px;font-weight:500}
.btn{width:100%;padding:12px;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s}
.btn-p{background:var(--brown);color:#fff}
.btn-p:hover{background:var(--brown2)}
.btn-p:disabled{background:var(--border);color:var(--txt3);cursor:not-allowed}

.btn-danger{background:var(--red-pale);color:var(--red);border:1px solid #F1A9A0}
.nav-row{display:flex;gap:8px;margin-top:12px}
.nav-row .btn{margin-top:0}
.status-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.prog{font-size:11px;color:var(--txt3);font-family:var(--mono)}
.sec-hdr{background:var(--bg);padding:6px 10px;border-radius:6px;font-size:11px;font-weight:600;color:var(--txt2);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.05em}
.demand-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border2)}
.demand-row:last-child{border-bottom:none}
.demand-name{flex:1;font-size:13px;color:var(--txt)}
.demand-input{width:65px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;text-align:center;background:var(--card);color:var(--txt);font-family:var(--font)}
.success-wrap{text-align:center;padding:40px 14px}
.success-icon{width:54px;height:54px;border-radius:50%;background:var(--green-pale);display:flex;align-items:center;justify-content:center;margin:0 auto 13px;font-size:24px;color:var(--green)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:20px;font-size:11px;font-weight:500}
.b-red{background:var(--red-pale);color:var(--red)}
.b-orange{background:var(--orange-pale);color:var(--orange)}
.b-green{background:var(--green-pale);color:var(--green)}
.b-brown{background:var(--brown-pale);color:var(--brown)}
.b-gray{background:var(--bg);color:var(--txt3);border:1px solid var(--border)}
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.mv{font-size:22px;font-weight:600;font-family:var(--mono)}
.ml{font-size:11px;color:var(--txt3);margin-top:2px}
.outlet-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .1s;border-radius:var(--radius-sm)}
.outlet-row:last-child{border-bottom:none}
.outlet-row:hover{background:var(--bg);margin:0 -16px;padding:10px 16px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-g{background:var(--green)}
.dot-o{background:var(--orange)}
.dot-r{background:var(--red)}
.outlet-name{flex:1;font-size:13px;font-weight:500}
.badges-wrap{display:flex;gap:4px;flex-wrap:wrap}
.alert-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border2)}

.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.alert-title{font-size:13px;font-weight:500}
.alert-sub{font-size:11px;color:var(--txt3);margin-top:1px}
.pl-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--border2)}
.pl-row:last-child{border-bottom:none}
.pl-name{flex:1;font-size:12px;color:var(--txt)}
.pl-num{width:44px;text-align:center;font-size:12px;font-family:var(--mono);color:var(--txt2)}

.pl-hdr{font-size:9px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.month-tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;scrollbar-width:none}
.month-tabs::-webkit-scrollbar{display:none}
.m-tab{padding:5px 11px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;background:var(--card);color:var(--txt2);font-family:var(--font);flex-shrink:0}

.chart-bars{display:flex;align-items:flex-end;gap:3px;height:70px;margin:10px 0 4px}
.bar{flex:1;background:var(--brown-pale);border-radius:3px 3px 0 0;border:1px solid var(--brown-border);min-height:3px;cursor:pointer;transition:background .1s}

.chart-lbls{display:flex;gap:3px}
.chart-lbl{flex:1;font-size:8px;color:var(--txt3);text-align:center;font-family:var(--mono)}
.three-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sm-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.sm-val{font-size:17px;font-weight:600;font-family:var(--mono)}
.sm-lbl{font-size:10px;color:var(--txt3);margin-top:2px}
.tp-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border2)}
.tp-row:last-child{border-bottom:none}
.tp-rank{font-size:11px;color:var(--txt3);width:16px;font-family:var(--mono)}
.tp-name{flex:1;font-size:13px}
.tp-val{font-size:12px;font-weight:500;font-family:var(--mono)}
.tp-sub{font-size:10px;color:var(--txt3)}
.share-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font);margin-top:8px;color:#fff}
.pdf-btn{background:var(--brown)}
.wa-btn{background:#25D366}
.toggle{position:relative;width:38px;height:21px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:21px;transition:.2s}
.slider:before{position:absolute;content:"";height:15px;width:15px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s}
.toggle input:checked+.slider{background:var(--brown)}
.toggle input:checked+.slider:before{transform:translateX(17px)}
.tgl-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border2)}
.tgl-row:last-child{border-bottom:none}

.price-inp{width:75px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;text-align:right;background:var(--card);color:var(--txt);font-family:var(--mono)}
.price-inp:focus{outline:none;border-color:var(--brown)}
.add-form{display:flex;gap:8px;margin-top:10px}

.add-form input:focus{outline:none;border-color:var(--brown)}
.add-form button{padding:8px 13px;background:var(--brown);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;font-family:var(--font);white-space:nowrap}
.outlet-tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;scrollbar-width:none}
.outlet-tabs::-webkit-scrollbar{display:none}
.o-tab{padding:5px 11px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;background:var(--card);color:var(--txt2);font-family:var(--font);flex-shrink:0}
.o-tab.active{background:var(--brown);color:#fff;border-color:var(--brown)}
.dispatch-table{overflow-x:auto;margin-top:8px}
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl th{padding:6px 8px;background:var(--bg);color:var(--txt3);font-weight:600;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
.dtbl td{padding:6px 8px;border-bottom:1px solid var(--border2);text-align:center;font-family:var(--mono)}
.dtbl td:first-child{text-align:left;font-family:var(--font);font-size:12px}
.dtbl tr:last-child td{border-bottom:none}
.err-msg{background:var(--red-pale);border:1px solid #F1A9A0;color:var(--red);padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:10px;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1A1208;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:999;animation:fadeup .3s ease;pointer-events:none}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

<script>
const SB_URL = 'https://xkwkaboppewfcnrtjpfu.supabase.co';
const SB_KEY = 'sb_publishable_7wHYCzDArULQTDtTYOk5ew_mQZIKVfl';

async function sbGet(table, params='') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}${params}`, {
    headers: {'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Accept':'application/json'}
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(table, body) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPatch(table, params, body) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}${params}`, {
    method:'PATCH',
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(table, params) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}${params}`, {
    method:'DELETE',
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}
  });
  if (!r.ok) throw new Error(await r.text());
}

async function init() {
  showLoading('Loading Brownie Heaven...');
  try {
    DB.products = await sbGet('products','?order=category_id,sort_order');
    // Fix product names client-side
    DB.products.forEach(p => {
      if (p.name === 'Blue & White Chocolate Medovik') p.name = 'Blueberry Medovik';
      if (p.name === 'Overloaded Cake 1/2kg') p.name = 'Overloaded Cake 750g';
      if (p.name === 'Pink Rose Strawberry 1/2kg') p.name = 'Pink Rose Strawberry 850g';
    });
    DB.outlets = await sbGet('outlets','?order=id');
    const cfg = await sbGet('outlet_product_config');
    DB.outletConfig = {};
    cfg.forEach(c => {
      if (!DB.outletConfig[c.outlet_id]) DB.outletConfig[c.outlet_id] = {};
      DB.outletConfig[c.outlet_id][c.product_id] = c.is_active;
    });
  } catch(e) { console.warn('Offline mode:', e); }
  renderPin();
}

function startApp() {

  document.getElementById('main-app').style.display = 'flex';

function showLoading(msg='Loading...') {
  document.getElementById('screen').innerHTML = `<div class="loading"><div class="spinner"></div><div style="font-size:13px;color:var(--txt3)">${msg}</div></div>`;
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function setHdr(sub, showTabs) {

function pressNum(n) {
  if (n==='del') { S.pin=S.pin.slice(0,-1); S.pinError=false; renderPin(); return; }
  if (S.pin.length>=4) return;
  S.pin += n;
  if (S.pin.length===4) {
    if (OUTLET_PINS[S.pin]) {
      S.outlet=S.pin; S.outletName=OUTLET_PINS[S.pin];
      S.pinError=false; S.stockData={}; S.demandData={};
      setHdr(S.outletName, false);
      renderShift();
    } else if (S.pin==='9999') {
      S.role='admin'; S.mainTab=0; setTab(0);
    } else if (S.pin==='3001'||S.pin==='2001') {
      S.role='dispatch'; setHdr('Gautham — Dispatch', false); renderDispatch();
    } else {
      S.pinError=true; S.pin=''; renderPin();
    }
    return;
  }
  renderPin();
}

function getOutletCats() {
  const disabled = DISABLED_BY_OUTLET[S.outlet] || [];
  const disabledProds = DB.outletConfig[S.outlet] || {};
  return CAT_ORDER
    .filter(catId => !disabled.includes(catId))
    .map(catId => {
      const prods = DB.products
        .filter(p => p.category_id===catId)
        .filter(p => disabledProds[p.id]!==false)
        .filter(p => !DISCONTINUED.includes(p.name));
      return {id:catId, label:CAT_LABELS[catId], products:prods};
    })
    .filter(c => c.products.length > 0);
}

function calcCl(catId, prodId) {
  const d = (S.stockData[catId]||{})[prodId] || {};
  return Math.max(0,(+d.opening||0)+(+d.incoming||0)-(+d.dineIn||0)-(+d.swiggy||0)-(+d.zomato||0)-(+d.expiryQty||0));
}

function setStock(catId, prodId, field, val) {
  if (!S.stockData[catId]) S.stockData[catId]={};
  if (!S.stockData[catId][prodId]) S.stockData[catId][prodId]={};
  S.stockData[catId][prodId][field]=val;
  const cl=calcCl(catId,prodId);
  const el=document.getElementById(`cl_${catId}_${prodId}`);
  if(el) el.value=cl||'';
}

// ── SUBMIT ────────────────────────────────────────────────────────────────────
async function submitShift() {
  const btns = document.querySelectorAll('.btn-p');
  btns.forEach(b=>{b.disabled=true;});
  const first = document.querySelector('.btn-p');
  if(first) first.textContent = 'Saving...';
  try {
    const today = new Date().toISOString().split('T')[0];
    const entries = await sbPost('shift_entries',[{outlet_id:S.outlet,entry_date:today,shift:S.shift,staff_name:S.staffName}]);
    const entryId = entries[0].id;
    const lines = [];
    Object.entries(S.stockData).forEach(([catId,prods])=>{
      Object.entries(prods).forEach(([prodId,d])=>{
        if(Object.values(d).some(v=>v&&v!=='')) {
          lines.push({entry_id:entryId,product_id:parseInt(prodId),
            opening:+d.opening||0,incoming:+d.incoming||0,
            dine_in:+d.dineIn||0,swiggy:+d.swiggy||0,zomato:+d.zomato||0,
            expiry_qty:+d.expiryQty||0,expiry_date:d.expiryDate||null});
        }
      });
    });
    if(lines.length) await sbPost('stock_lines',lines);
    // Only save demand requests for night shift
    if (S.shift === 'night') {
      const demands=[];
      const tmrw=new Date(); tmrw.setDate(tmrw.getDate()+1);
      const tmrwStr=tmrw.toISOString().split('T')[0];
      Object.entries(S.demandData).forEach(([prodId,qty])=>{
        if(qty&&+qty>0) demands.push({outlet_id:S.outlet,entry_date:tmrwStr,product_id:parseInt(prodId),requested_qty:+qty});
      });
      if(demands.length) await sbPost('demand_requests',demands);
    }
    renderSuccess();
  } catch(e) {
    toast('Error saving. Please try again.');
    const btns2=document.querySelectorAll('.btn-p');
    btns2.forEach(b=>{b.disabled=false;});
    const first2=document.querySelector('.btn-p');
    if(first2) first2.textContent='✓ Submit shift entry';
  }
}

// ── SUCCESS ───────────────────────────────────────────────────────────────────
function renderSuccess() {
  const shiftTimes={morning:'9:30 AM – 6:30 PM',evening:'2:30 PM – 11:00 PM',night:'6:30 PM – 3:00 AM'};
  let totalSold=0,wasteVal=0,expiryLines=[];
  Object.entries(S.stockData).forEach(([catId,prods])=>{
    Object.entries(prods).forEach(([prodId,d])=>{
      const sold=(+d.dineIn||0)+(+d.swiggy||0)+(+d.zomato||0);
      totalSold+=sold;
      const wq=+d.expiryQty||0;
      if(wq>0){
        const prod=DB.products.find(p=>p.id==prodId);
        const price=prod?.price||0;
        wasteVal+=wq*price;
        expiryLines.push(`<div class="alert-row"><div class="alert-dot" style="background:var(--red)"></div><div><div class="alert-title">${prod?.name||'Product'}</div><div class="alert-sub">${wq} expired · ₹${wq*price} lost</div></div></div>`);
      }
    });
  });
  document.getElementById('screen').innerHTML = `
  <div class="success-wrap">
    <div class="success-icon">✓</div>
    <h2 style="font-size:18px;font-weight:600;margin-bottom:8px">Shift submitted!</h2>
    <p style="font-size:14px;color:var(--txt2);margin-bottom:4px">${S.outletName} — ${S.shift} shift</p>
    <p style="font-size:12px;color:var(--txt3);margin-bottom:16px">${shiftTimes[S.shift]}</p>
    <div class="card" style="text-align:left">
      <div class="card-title">Shift summary</div>
      <div style="display:flex;gap:20px;margin-bottom:${expiryLines.length?12:0}px">
        <div><div style="font-size:20px;font-weight:600;font-family:var(--mono)">${totalSold}</div><div style="font-size:11px;color:var(--txt3)">Units sold</div></div>
        <div><div style="font-size:20px;font-weight:600;font-family:var(--mono);color:var(--red)">₹${wasteVal}</div><div style="font-size:11px;color:var(--txt3)">Wastage value</div></div>
      </div>
      ${expiryLines.length?'<div class="card-title">Expiry</div>'+expiryLines.join(''):'<div style="font-size:13px;color:var(--green)">✓ No expiry today</div>'}
    </div>
    <button class="btn btn-p" style="max-width:220px;margin:16px auto 0" onclick="goHome()">🏠 Back to Home</button>
  </div>`;
}

// ── DISPATCH ──────────────────────────────────────────────────────────────────
async function renderDispatch() {
  showLoading('Loading demands...');
  try {
    const tmrw=new Date(); tmrw.setDate(tmrw.getDate()+1);
    const dateStr=tmrw.toISOString().split('T')[0];
    const demands=await sbGet('demand_requests',`?entry_date=eq.${dateStr}&select=*,products(name,category_id)`);
    if(!demands.length){
      document.getElementById('screen').innerHTML=`<div class="card" style="margin-top:14px"><div class="card-title">Dispatch — ${dateStr}</div><p style="font-size:13px;color:var(--txt2)">No demand requests yet for tomorrow.</p></div>`;
      return;
    }
    const byProd={};
    demands.forEach(d=>{
      if(!byProd[d.product_id]) byProd[d.product_id]={name:d.products.name,outlets:{}};
      byProd[d.product_id].outlets[d.outlet_id]=(byProd[d.product_id].outlets[d.outlet_id]||0)+(+d.requested_qty||0);
    });
    const outletList=Object.keys(OUTLET_PINS);
    const rows=Object.entries(byProd).map(([pid,info])=>{
      const total=Object.values(info.outlets).reduce((a,b)=>a+b,0);
      return `<tr><td>${info.name}</td>${outletList.map(o=>`<td>${info.outlets[o]||'—'}</td>`).join('')}<td style="font-weight:600">${total}</td></tr>`;
    }).join('');
    document.getElementById('screen').innerHTML=`
    <div style="margin-top:14px">
      <div class="card">
        <div class="card-title">Outlet demands for ${dateStr}</div>
        <div class="dispatch-table">
          <table class="dtbl">
            <thead><tr><th>Product</th>${outletList.map(o=>`<th>${OUTLET_PINS[o].split(' ')[0]}</th>`).join('')}<th>Total</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  } catch(e){ document.getElementById('screen').innerHTML=`<div class="card" style="margin-top:14px"><p style="color:var(--red)">Error loading demands.</p></div>`; }
}

  try {
    const today=new Date().toISOString().split('T')[0];
    const entries=await sbGet('shift_entries',`?entry_date=eq.${today}&select=*,stock_lines(*,products(name,price))`);
    const byOutlet={};
    entries.forEach(e=>{
      if(!byOutlet[e.outlet_id]) byOutlet[e.outlet_id]={shifts:[],lines:[]};
      byOutlet[e.outlet_id].shifts.push(e.shift);
      (e.stock_lines||[]).forEach(l=>byOutlet[e.outlet_id].lines.push(l));
    });
    let totalSold=0,totalWaste=0,allAlerts=[];
    const outletRows=Object.entries(OUTLET_PINS).map(([pin,name])=>{
      const data=byOutlet[pin]||{shifts:[],lines:[]};
      const shiftsCount=new Set(data.shifts).size;
      let critical=0,low=0,expiring=0,outletSold=0;
      data.lines.forEach(l=>{
        const sold=(+l.dine_in||0)+(+l.swiggy||0)+(+l.zomato||0);
        outletSold+=sold;
        const cl=+l.closing||0;
        if(cl===0&&sold>0) critical++;
        else if(cl<=2&&cl>0) low++;
        if(+l.expiry_qty>0){
          expiring++;
          const lv=(+l.expiry_qty)*(+l.products?.price||0);
          totalWaste+=lv;
          allAlerts.push({prod:l.products?.name,outlet:name,qty:l.expiry_qty,val:lv});
        }
      });
      totalSold+=outletSold;
      const dotClass=shiftsCount===0?'dot-r':shiftsCount<3?'dot-o':'dot-g';
      return `<div class="outlet-row" onclick="showOutletDetail('${pin}','${name}')">
        <div class="dot ${dotClass}"></div>
        <div class="outlet-name">${name}${pin==='1001'?' ⭐':''}</div>
        <div class="badges-wrap">
          ${shiftsCount?`<span class="badge b-brown">${shiftsCount}/3</span>`:'<span class="badge b-gray">No data</span>'}
          ${critical?`<span class="badge b-red">🔴 ${critical}</span>`:''}
          ${low?`<span class="badge b-orange">🟡 ${low}</span>`:''}
          ${expiring?`<span class="badge b-red">⚠️ ${expiring}</span>`:''}
        </div>
      </div>`;
    }).join('');
    const alertHtml=allAlerts.length?`<div class="card"><div class="card-title">⚠️ Expiry alerts today</div>${allAlerts.map(a=>`<div class="alert-row"><div class="alert-dot" style="background:var(--red)"></div><div><div class="alert-title">${a.prod}</div><div class="alert-sub">${a.outlet} · ${a.qty} units · ₹${a.val} lost</div></div></div>`).join('')}</div>`:'';
    document.getElementById('screen').innerHTML=`
    <div style="margin-top:12px">
      <div class="dash-grid">
        <div class="metric-card"><div class="mv">${totalSold}</div><div class="ml">Units sold today</div></div>
        <div class="metric-card"><div class="mv" style="color:var(--red)">₹${totalWaste}</div><div class="ml">Wastage today</div></div>
      </div>
      <div class="card"><div class="card-title">All outlets — ${new Date().toLocaleDateString('en-GB')}</div>${outletRows}</div>
      ${alertHtml}
      <div class="card">
        <div class="card-title" style="color:var(--red)">🗑 Clear test data</div>
        <p style="font-size:13px;color:var(--txt2);margin-bottom:10px">Remove all demo/test entries from today.</p>
        <button class="btn btn-danger" onclick="clearTestData()">Clear today's test data</button>
      </div>
    </div>`;
  } catch(e){ document.getElementById('screen').innerHTML=`<div class="card" style="margin-top:14px"><p style="color:var(--red);font-size:13px">Error loading data.</p></div>`; }
}

async function clearTestData() {
  if(!confirm('Delete ALL entries for today? This cannot be undone.')) return;
  try {
    const today=new Date().toISOString().split('T')[0];
    await sbDelete('shift_entries',`?entry_date=eq.${today}`);
    await sbDelete('demand_requests',`?entry_date=eq.${today}`);
    toast('Test data cleared ✓');
    renderOverview();
  } catch(e){ toast('Error clearing data'); }
}

async function showOutletDetail(pin, name) {
  showLoading(`Loading ${name}...`);
  try {
    const today=new Date().toISOString().split('T')[0];
    const entries=await sbGet('shift_entries',`?outlet_id=eq.${pin}&entry_date=eq.${today}&select=*,stock_lines(*,products(name,price,category_id))&order=submitted_at.desc&limit=3`);
    if(!entries.length){ toast('No data for '+name+' today'); renderOverview(); return; }
    const lastEntry=entries[0];
    const lines=lastEntry.stock_lines||[];
    const byCat={};
    lines.forEach(l=>{ const cat=l.products?.category_id||'other'; if(!byCat[cat]) byCat[cat]=[]; byCat[cat].push(l); });
    const catHtml=CAT_ORDER.map(catId=>{
      if(!byCat[catId]) return '';
      const prodRows=byCat[catId].map(l=>{
        const sold=(+l.dine_in||0)+(+l.swiggy||0)+(+l.zomato||0);
        const cl=+l.closing||0;
        const color=cl===0?'var(--red)':cl<=2?'var(--orange)':'var(--green)';
        return `<div class="tp-row"><div class="tp-name">${l.products?.name}</div><div style="text-align:right"><div class="tp-val" style="color:${color}">Cl: ${cl}</div><div class="tp-sub">Sold: ${sold}</div></div></div>`;
      }).join('');
      return `<div class="sec-hdr">${CAT_LABELS[catId]}</div>${prodRows}`;
    }).join('');
    document.getElementById('screen').innerHTML=`
    <div style="margin-top:12px">
      <div class="card">
        <div class="card-title">${name} — ${lastEntry.shift} shift snapshot</div>
        <div style="font-size:12px;color:var(--txt3);margin-bottom:12px">Staff: ${lastEntry.staff_name} · ${new Date(lastEntry.submitted_at).toLocaleTimeString()}</div>
        ${catHtml||'<p style="font-size:13px;color:var(--txt2)">No stock data in this entry.</p>'}
      </div>
      <button class="btn btn-s" onclick="renderOverview()">← Back to overview</button>
    </div>`;
  } catch(e){ toast('Error'); renderOverview(); }
}

// ── PRODUCTION ────────────────────────────────────────────────────────────────
function renderProduction() {
  const lists=[
    {id:'cakes_pastry',label:'Cakes & Pastries',cats:['half_cakes','one_cakes','pastry','mini_cups']},
    {id:'brownies',label:'Brownies',cats:['brownies','eggless','boxes']},
    {id:'evening',label:'Evening Kitchen',cats:['medovik','eclair','tubs','cheesecake','special']}
  ];
  const tabs=lists.map((l,i)=>`<button class="tab ${S.productionTab===i?'active':''}" onclick="S.productionTab=${i};renderProduction()">${l.label}</button>`).join('');
  const cur=lists[S.productionTab];
  const prods=DB.products.filter(p=>cur.cats.includes(p.category_id)&&!DISCONTINUED.includes(p.name));
  let lastCat='';
  const rows=prods.map(p=>{
    const pd=(S.productionData[cur.id]||{})[p.id]||{};
    const bal=pd.balance||0;
    const sug=Math.max(0,20-bal);
    let catHdr='';
    if(p.category_id!==lastCat){ catHdr=`<div class="sec-hdr">${CAT_LABELS[p.category_id]}</div>`; lastCat=p.category_id; }
    return catHdr+`<div class="pl-row">
      <div class="pl-name">${p.name}</div>
      <div class="pl-num">${bal||'—'}</div>
      <div class="pl-sug">${sug||'—'}</div>
      <input class="pl-inp" type="number" min="0" placeholder="0" value="${pd.qty||''}" oninput="setProd('${cur.id}',${p.id},this.value)">
    </div>`;
  }).join('');
  document.getElementById('screen').innerHTML=`
  <div style="margin-top:12px">
    <div class="tabs">${tabs}</div>
    <div class="card">
      <div class="status-bar"><div class="card-title" style="margin:0">${cur.label}</div><div class="prog">${new Date().toLocaleDateString('en-GB')}</div></div>
      <div class="pl-row" style="border-bottom:1px solid var(--border)">
        <div class="pl-name pl-hdr">Product</div>
        <div class="pl-num pl-hdr">Balance</div>
        <div class="pl-sug pl-hdr">Suggested</div>
        <div style="width:50px;font-size:9px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.04em">To Make</div>
      </div>
      ${rows}
      <button class="btn btn-p" style="margin-top:14px" onclick="saveProduction('${cur.id}')">✓ Finalise & share list</button>
    </div>
  </div>`;
}
function setProd(listId,prodId,val){
  if(!S.productionData[listId]) S.productionData[listId]={};
  if(!S.productionData[listId][prodId]) S.productionData[listId][prodId]={};
  S.productionData[listId][prodId].qty=val;
}
async function saveProduction(listId){
  const today=new Date().toISOString().split('T')[0];
  const entries=Object.entries(S.productionData[listId]||{}).map(([prodId,d])=>({list_date:today,list_type:listId,product_id:parseInt(prodId),production_qty:+d.qty||0}));
  if(!entries.length){ toast('Nothing to save'); return; }
  try{ await sbPost('production_lists',entries); toast('Production list saved ✓'); }
  catch(e){ toast('Error saving'); }
}

// ── MONTHLY ───────────────────────────────────────────────────────────────────
async function renderMonthly() {
  setHdr('Dashboard', true);
  showLoading('Loading monthly data...');
  try {
    const monthStr=String(S.selMonth+1).padStart(2,'0');
    const startDate=`${S.selYear}-${monthStr}-01`;
    const endDate=`${S.selYear}-${monthStr}-${new Date(S.selYear,S.selMonth+1,0).getDate()}`;
    const entries=await sbGet('shift_entries',`?entry_date=gte.${startDate}&entry_date=lte.${endDate}&select=*,stock_lines(*,products(name,price))`);
    const dailySales={};
    let totalSold=0,totalWaste=0;
    const prodSales={},prodWaste={};
    entries.forEach(e=>{
      const day=new Date(e.entry_date).getDate();
      if(!dailySales[day]) dailySales[day]=0;
      (e.stock_lines||[]).forEach(l=>{
        const sold=(+l.dine_in||0)+(+l.swiggy||0)+(+l.zomato||0);
        dailySales[day]+=sold; totalSold+=sold;
        const pn=l.products?.name||'Unknown';
        prodSales[pn]=(prodSales[pn]||0)+sold;
        const wq=+l.expiry_qty||0;
        if(wq>0){ const wv=wq*(+l.products?.price||0); totalWaste+=wv; prodWaste[pn]=(prodWaste[pn]||0)+wv; }
      });
    });
    const daysInMonth=new Date(S.selYear,S.selMonth+1,0).getDate();
    const dayVals=Array.from({length:daysInMonth},(_,i)=>dailySales[i+1]||0);
    const maxVal=Math.max(...dayVals,1);
    const bars=dayVals.map((v,i)=>`<div class="bar ${i===new Date().getDate()-1&&S.selMonth===new Date().getMonth()?'active-bar':''}" style="height:${Math.max(3,Math.round(v/maxVal*66))}px" title="Day ${i+1}: ${v}"></div>`).join('');
    const lbls=dayVals.map((_,i)=>`<div class="chart-lbl">${i+1}</div>`).join('');
    const topProds=Object.entries(prodSales).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const deadProds=Object.entries(prodSales).filter(([,v])=>v===0).slice(0,5);
    const topWaste=Object.entries(prodWaste).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const monthTabs=MONTHS_SHORT.map((m,i)=>`<button class="m-tab ${i===S.selMonth?'active':''}" onclick="S.selMonth=${i};renderMonthly()">${m}</button>`).join('');
    document.getElementById('screen').innerHTML=`
    <div style="margin-top:12px">
      <div class="month-tabs">${monthTabs}</div>
      <div class="three-grid">
        <div class="sm-card"><div class="sm-val">${totalSold}</div><div class="sm-lbl">Units sold</div></div>
        <div class="sm-card"><div class="sm-val" style="color:var(--red)">₹${totalWaste}</div><div class="sm-lbl">Wastage</div></div>
        <div class="sm-card"><div class="sm-val">${daysInMonth>0?Math.round(totalSold/daysInMonth):0}</div><div class="sm-lbl">Daily avg</div></div>
      </div>
      <div class="card">
        <div class="card-title">Daily sales — ${MONTHS[S.selMonth]} ${S.selYear}</div>
        <div class="chart-bars">${bars}</div>
        <div class="chart-lbls">${lbls}</div>
      </div>
      <div class="card">
        <div class="card-title">Top 5 products this month</div>
        ${topProds.length?topProds.map(([n,v],i)=>`<div class="tp-row"><div class="tp-rank">${i+1}</div><div class="tp-name">${n}</div><div class="tp-val">${v} units</div></div>`).join(''):'<p style="font-size:13px;color:var(--txt3)">No data yet.</p>'}
      </div>
      ${topWaste.length?`<div class="card"><div class="card-title">Top wastage this month</div>${topWaste.map(([n,v],i)=>`<div class="tp-row"><div class="tp-rank">${i+1}</div><div class="tp-name">${n}</div><div class="tp-val" style="color:var(--red)">₹${v}</div></div>`).join('')}</div>`:''}
      ${deadProds.length?`<div class="card"><div class="card-title">Dead stock (0 sales)</div>${deadProds.map(([n],i)=>`<div class="tp-row"><div class="tp-rank">${i+1}</div><div class="tp-name">${n}</div><div class="tp-val" style="color:var(--txt3)">0 units</div></div>`).join('')}</div>`:''}
      <button class="share-btn pdf-btn" onclick="window.print()">📄 Download PDF Report</button>
      <button class="share-btn wa-btn" onclick="window.open('https://wa.me/?text='+encodeURIComponent('Brownie Heaven — ${MONTHS[S.selMonth]} ${S.selYear} Report\nstock.brownieheaven.in'))">📱 Share on WhatsApp</button>
    </div>`;
  } catch(e){ document.getElementById('screen').innerHTML=`<div class="card" style="margin-top:14px"><p style="color:var(--red);font-size:13px">Error loading monthly data.</p></div>`; }
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
function renderAdmin() {
  setHdr('Dashboard', true);
  const pin=S.adminOutlet;
  const disabled=DISABLED_BY_OUTLET[pin]||[];
  const disabledProds=DB.outletConfig[pin]||{};
  const outletTabs=Object.entries(OUTLET_PINS).map(([p,n])=>`<button class="o-tab ${p===pin?'active':''}" onclick="S.adminOutlet='${p}';S.adminCatIdx=0;renderAdmin()">${n}</button>`).join('');
  const catTabs=CAT_ORDER.map((c,i)=>`<button class="tab ${S.adminCatIdx===i?'active':''}" onclick="S.adminCatIdx=${i};renderAdmin()">${CAT_LABELS[c]||c}</button>`).join('');
  const curCatId=CAT_ORDER[S.adminCatIdx];
  const isCatDisabled=disabled.includes(curCatId);
  const prods=DB.products.filter(p=>p.category_id===curCatId);
  const prodRows=prods.map(p=>{
    const isDiscontinued=DISCONTINUED.includes(p.name);
    const isOff=isCatDisabled||disabledProds[p.id]===false;
    return `<div class="tgl-row" style="${isCatDisabled?'opacity:0.4;pointer-events:none':''}">
      <div class="tgl-name" style="${isOff||isDiscontinued?'color:var(--txt3)':''}">${p.name}${isDiscontinued?' <span style="font-size:10px;color:var(--orange)">(discontinued)</span>':''}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="display:flex;align-items:center;gap:3px">
          <span style="font-size:11px;color:var(--txt3)">₹</span>
          <input class="price-inp" type="number" value="${p.price||''}" placeholder="0" onchange="updatePrice(${p.id},this.value)">
        </div>
        <label class="toggle"><input type="checkbox" ${!isOff&&!isDiscontinued?'checked':''} onchange="toggleProd('${pin}',${p.id},this.checked)"><span class="slider"></span></label>
      </div>
    </div>`;
  }).join('');
  document.getElementById('screen').innerHTML=`
  <div style="margin-top:12px">
    <div class="card">
      <div class="card-title">Product config & prices</div>
      <p style="font-size:13px;color:var(--txt2);margin-bottom:12px">Toggle products per outlet · Edit prices · Add new products</p>
      <div class="outlet-tabs">${outletTabs}</div>
      <div class="outlet-badge">🍫 ${OUTLET_PINS[pin]}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:13px;font-weight:500">${CAT_LABELS[curCatId]} — whole category</div>
        <label class="toggle"><input type="checkbox" ${!isCatDisabled?'checked':''} onchange="toggleCat('${pin}','${curCatId}',this.checked)"><span class="slider"></span></label>
      </div>
      <div class="tabs">${catTabs}</div>
      ${prodRows}
      <div class="add-form">
        <input type="text" placeholder="Add new product to ${CAT_LABELS[curCatId]}..." id="new-p" oninput="S.newProdName['${curCatId}']=this.value">
        <button onclick="addProd('${curCatId}')">+ Add</button>
      </div>
    </div>
  </div>`;
}

function toggleCat(pin,catId,active){
  if(!DISABLED_BY_OUTLET[pin]) DISABLED_BY_OUTLET[pin]=[];
  const dc=DISABLED_BY_OUTLET[pin];
  if(!active&&!dc.includes(catId)) dc.push(catId);
  else if(active) DISABLED_BY_OUTLET[pin]=dc.filter(c=>c!==catId);
  renderAdmin();
}
async function toggleProd(pin,prodId,active){
  if(!DB.outletConfig[pin]) DB.outletConfig[pin]={};
  DB.outletConfig[pin][prodId]=active;
  try{ await sbPost('outlet_product_config',[{outlet_id:pin,product_id:prodId,is_active:active}]); toast(active?'Product enabled ✓':'Product disabled'); }
  catch(e){ toast('Error updating config'); }
}
async function updatePrice(prodId,val){
  const prod=DB.products.find(p=>p.id===prodId);
  if(prod){ prod.price=+val;
    try{ await sbPatch('products',`?id=eq.${prodId}`,{price:+val}); toast('Price updated ✓'); }
    catch(e){ toast('Error updating price'); }
  }
}
async function addProd(catId){
  const name=(S.newProdName[catId]||'').trim();
  if(!name) return;
  try{
    const res=await sbPost('products',[{name,category_id:catId,price:0,sort_order:999}]);
    DB.products.push(res[0]); S.newProdName[catId]='';
    toast('Product added ✓'); renderAdmin();
  } catch(e){ toast('Error adding product'); }
}

// App starts via welcome screen Get Started button → startApp()
</script>
