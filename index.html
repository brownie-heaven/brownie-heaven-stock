
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Brownie Heaven — Stock</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brown:#6B2400;--brown2:#8B3A00;--brown-pale:#FFF3EE;--brown-border:#F5D5C8;
  --green:#2D6A2D;--green-pale:#EAF3DE;
  --orange:#C96000;--orange-pale:#FFF4E0;
  --red:#B03020;--red-pale:#FDECEB;
  --bg:#F7F4F1;--card:#FFFFFF;--border:#E8E0D8;--border2:#F0EAE4;
  --txt:#1A1208;--txt2:#6B5C4E;--txt3:#A0917F;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --radius:12px;--radius-sm:8px;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--txt);font-size:14px}
.app{min-height:100vh;display:none;flex-direction:column}
.app.app-visible{display:flex}
.hdr{background:var(--brown);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;flex-shrink:0}
.hdr-left{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--brown);flex-shrink:0}
.hdr-title{color:#fff;font-size:15px;font-weight:600;line-height:1.2}
.hdr-sub{color:rgba(255,255,255,0.65);font-size:11px}
.hdr-right{display:flex;gap:6px;align-items:center}
.hdr-btn{background:rgba(255,255,255,0.18);border:none;color:#fff;padding:6px 11px;border-radius:20px;font-size:12px;cursor:pointer;font-family:var(--font);white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,0.28)}
.logout-btn{background:rgba(255,80,50,0.35);border:none;color:#fff;padding:6px 11px;border-radius:20px;font-size:12px;cursor:pointer;font-family:var(--font)}
.logout-btn:hover{background:rgba(255,80,50,0.5)}
.main-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:100;flex-shrink:0}
.mt{flex:1;padding:11px 4px;border:none;background:transparent;font-size:11px;font-weight:500;color:var(--txt3);cursor:pointer;font-family:var(--font);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.mt.active{color:var(--brown);border-bottom-color:var(--brown)}
.screen{padding:14px;max-width:700px;width:100%;margin:0 auto;flex:1}
.loading{display:flex;align-items:center;justify-content:center;padding:60px 20px;flex-direction:column;gap:12px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--brown);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.pin-wrap{max-width:260px;margin:20px auto 0}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:18px 0}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:all .15s}
.pin-dot.filled{background:var(--brown);border-color:var(--brown)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nb{padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--txt);font-size:18px;font-weight:500;cursor:pointer;font-family:var(--font);transition:background .1s;text-align:center}
.nb:active{background:var(--bg)}
.nb.del{font-size:13px;color:var(--txt3)}
.shift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.shift-btn{padding:11px 6px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--txt);font-size:12px;cursor:pointer;text-align:center;font-family:var(--font);line-height:1.4;transition:all .15s}
.shift-btn .st{font-size:10px;color:var(--txt3);margin-top:2px}
.shift-btn.sel{border:2px solid var(--brown);background:var(--brown-pale);color:var(--brown)}
.shift-btn.sel .st{color:var(--brown)}
.outlet-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;background:var(--brown-pale);color:var(--brown);border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--brown-border);margin-bottom:12px}
.field{margin-bottom:11px}
.field label{font-size:12px;color:var(--txt2);display:block;margin-bottom:4px;font-weight:500}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--card);color:var(--txt);font-family:var(--font)}
.field input:focus,.field select:focus{outline:none;border-color:var(--brown)}
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;background:var(--card);color:var(--txt2);font-family:var(--font);font-weight:500;transition:all .15s;flex-shrink:0}
.tab.active{background:var(--brown);color:#fff;border-color:var(--brown)}
.prod-row{border-bottom:1px solid var(--border2);padding:10px 0}
.prod-row:last-child{border-bottom:none}
.prod-name{font-size:13px;font-weight:500;color:var(--txt);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.prod-price{font-size:10px;color:var(--txt3);font-family:var(--mono)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.fg{text-align:center}
.fg label{font-size:9px;color:var(--txt3);display:block;margin-bottom:2px;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.fg input{width:100%;padding:5px 2px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:center;background:var(--card);color:var(--txt);font-family:var(--font)}
.fg input:focus{outline:none;border-color:var(--brown)}
.fg input.ro{background:var(--bg);color:var(--txt2)}
.fg input.cl{background:var(--brown-pale);border-color:var(--brown-border);color:var(--brown);font-weight:600}
.sales-lbl{font-size:10px;color:var(--txt3);margin:6px 0 3px;font-weight:500}
.btn{width:100%;padding:12px;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s}
.btn-p{background:var(--brown);color:#fff}
.btn-p:hover{background:var(--brown2)}
.btn-p:disabled{background:var(--border);color:var(--txt3);cursor:not-allowed}
.btn-s{background:var(--bg);color:var(--txt);border:1px solid var(--border)}
.btn-danger{background:var(--red-pale);color:var(--red);border:1px solid #F1A9A0}
.nav-row{display:flex;gap:8px;margin-top:12px}
.nav-row .btn{margin-top:0}
.status-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.prog{font-size:11px;color:var(--txt3);font-family:var(--mono)}
.sec-hdr{background:var(--bg);padding:6px 10px;border-radius:6px;font-size:11px;font-weight:600;color:var(--txt2);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.05em}
.demand-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border2)}
.demand-row:last-child{border-bottom:none}
.demand-name{flex:1;font-size:13px;color:var(--txt)}
.demand-input{width:65px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;text-align:center;background:var(--card);color:var(--txt);font-family:var(--font)}
.success-wrap{text-align:center;padding:40px 14px}
.success-icon{width:54px;height:54px;border-radius:50%;background:var(--green-pale);display:flex;align-items:center;justify-content:center;margin:0 auto 13px;font-size:24px;color:var(--green)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:20px;font-size:11px;font-weight:500}
.b-red{background:var(--red-pale);color:var(--red)}
.b-orange{background:var(--orange-pale);color:var(--orange)}
.b-green{background:var(--green-pale);color:var(--green)}
.b-brown{background:var(--brown-pale);color:var(--brown)}
.b-gray{background:var(--bg);color:var(--txt3);border:1px solid var(--border)}
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.mv{font-size:22px;font-weight:600;font-family:var(--mono)}
.ml{font-size:11px;color:var(--txt3);margin-top:2px}
.outlet-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .1s;border-radius:var(--radius-sm)}
.outlet-row:last-child{border-bottom:none}
.outlet-row:hover{background:var(--bg);margin:0 -16px;padding:10px 16px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-g{background:var(--green)}
.dot-o{background:var(--orange)}
.dot-r{background:var(--red)}
.outlet-name{flex:1;font-size:13px;font-weight:500}
.badges-wrap{display:flex;gap:4px;flex-wrap:wrap}
.alert-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border2)}
.alert-row:last-child{border-bottom:none}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.alert-title{font-size:13px;font-weight:500}
.alert-sub{font-size:11px;color:var(--txt3);margin-top:1px}
.pl-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--border2)}
.pl-row:last-child{border-bottom:none}
.pl-name{flex:1;font-size:12px;color:var(--txt)}
.pl-num{width:44px;text-align:center;font-size:12px;font-family:var(--mono);color:var(--txt2)}
.pl-sug{width:44px;text-align:center;font-size:12px;font-family:var(--mono);color:var(--orange)}
.pl-inp{width:50px;padding:5px 3px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:center;font-family:var(--mono);background:var(--card);color:var(--txt)}
.pl-inp:focus{outline:none;border-color:var(--brown)}
.pl-hdr{font-size:9px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.month-tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;scrollbar-width:none}
.month-tabs::-webkit-scrollbar{display:none}
.m-tab{padding:5px 11px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;background:var(--card);color:var(--txt2);font-family:var(--font);flex-shrink:0}
.m-tab.active{background:var(--brown);color:#fff;border-color:var(--brown)}
.chart-bars{display:flex;align-items:flex-end;gap:3px;height:70px;margin:10px 0 4px}
.bar{flex:1;background:var(--brown-pale);border-radius:3px 3px 0 0;border:1px solid var(--brown-border);min-height:3px;cursor:pointer;transition:background .1s}
.bar:hover,.bar.active-bar{background:var(--brown)}
.chart-lbls{display:flex;gap:3px}
.chart-lbl{flex:1;font-size:8px;color:var(--txt3);text-align:center;font-family:var(--mono)}
.three-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sm-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.sm-val{font-size:17px;font-weight:600;font-family:var(--mono)}
.sm-lbl{font-size:10px;color:var(--txt3);margin-top:2px}
.tp-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border2)}
.tp-row:last-child{border-bottom:none}
.tp-rank{font-size:11px;color:var(--txt3);width:16px;font-family:var(--mono)}
.tp-name{flex:1;font-size:13px}
.tp-val{font-size:12px;font-weight:500;font-family:var(--mono)}
.tp-sub{font-size:10px;color:var(--txt3)}
.share-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font);margin-top:8px;color:#fff}
.pdf-btn{background:var(--brown)}
.wa-btn{background:#25D366}
.toggle{position:relative;width:38px;height:21px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:21px;transition:.2s}
.slider:before{position:absolute;content:"";height:15px;width:15px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s}
.toggle input:checked+.slider{background:var(--brown)}
.toggle input:checked+.slider:before{transform:translateX(17px)}
.tgl-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border2)}
.tgl-row:last-child{border-bottom:none}
.tgl-name{font-size:13px}
.price-inp{width:75px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;text-align:right;background:var(--card);color:var(--txt);font-family:var(--mono)}
.price-inp:focus{outline:none;border-color:var(--brown)}
.add-form{display:flex;gap:8px;margin-top:10px}
.add-form input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--card);color:var(--txt);font-family:var(--font)}
.add-form input:focus{outline:none;border-color:var(--brown)}
.add-form button{padding:8px 13px;background:var(--brown);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;font-family:var(--font);white-space:nowrap}
.outlet-tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;scrollbar-width:none}
.outlet-tabs::-webkit-scrollbar{display:none}
.o-tab{padding:5px 11px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;background:var(--card);color:var(--txt2);font-family:var(--font);flex-shrink:0}
.o-tab.active{background:var(--brown);color:#fff;border-color:var(--brown)}
.dispatch-table{overflow-x:auto;margin-top:8px}
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl th{padding:6px 8px;background:var(--bg);color:var(--txt3);font-weight:600;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
.dtbl td{padding:6px 8px;border-bottom:1px solid var(--border2);text-align:center;font-family:var(--mono)}
.dtbl td:first-child{text-align:left;font-family:var(--font);font-size:12px}
.dtbl tr:last-child td{border-bottom:none}
.err-msg{background:var(--red-pale);border:1px solid #F1A9A0;color:var(--red);padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:10px;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1A1208;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:999;animation:fadeup .3s ease;pointer-events:none}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* DEMO BANNER */
.demo-banner{background:#FFF8E0;border:1px solid #F0D060;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#7A6000;display:flex;align-items:center;gap:8px}
/* PRODUCTION TABLE */
.ptbl{width:100%;border-collapse:collapse;font-size:12px}
.ptbl th{padding:8px 6px;background:var(--brown);color:#fff;text-align:center;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.ptbl th:first-child{text-align:left;padding-left:10px;min-width:130px}
.ptbl td{padding:7px 5px;border-bottom:1px solid var(--border2);text-align:center;font-family:var(--mono);font-size:12px}
.ptbl td:first-child{text-align:left;font-family:var(--font);padding-left:10px;font-size:12px;font-weight:500}
.ptbl .pcat{background:var(--bg);font-family:var(--font);font-weight:600;font-size:11px;color:var(--brown);text-transform:uppercase;letter-spacing:.05em;padding:5px 10px}
.ptbl .pcat td{text-align:left;color:var(--brown);font-weight:600}
.ptbl .ptotal{background:var(--brown-pale)}
.ptbl .ptotal td{font-weight:600;color:var(--brown)}
.ptbl input{width:54px;padding:4px 3px;border:1px solid var(--border);border-radius:5px;font-size:12px;text-align:center;font-family:var(--mono);background:var(--card);color:var(--txt)}
.ptbl input:focus{outline:none;border-color:var(--brown)}
.ptbl input.tomake{background:var(--brown-pale);border-color:var(--brown-border);color:var(--brown);font-weight:600}
.ptbl-wrap{overflow-x:auto}
/* DISPATCH TABLE */
.dtbl-new{width:100%;border-collapse:collapse;font-size:11px;min-width:500px}
.dtbl-new th{padding:7px 5px;background:var(--brown);color:#fff;text-align:center;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.dtbl-new th:first-child{text-align:left;padding-left:8px;min-width:120px}
.dtbl-new td{padding:6px 5px;border-bottom:1px solid var(--border2);text-align:center;font-family:var(--mono);font-size:11px}
.dtbl-new td:first-child{text-align:left;font-family:var(--font);font-size:11px;padding-left:8px}
.dtbl-new .dcat td{background:var(--bg);font-family:var(--font);font-weight:600;font-size:10px;color:var(--brown);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:4px 8px}
.dtbl-new .dtotal td{background:var(--brown-pale);font-weight:600;color:var(--brown)}
/* MONTHLY PER OUTLET */
.ob-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.ob-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px}
.ob-name{font-size:11px;font-weight:600;color:var(--brown);margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.ob-item{display:flex;justify-content:space-between;padding:3px 0;font-size:11px;border-bottom:1px solid var(--border2)}
.ob-item:last-child{border-bottom:none}
/* DEMO LOAD BTN */
.btn-gold{background:#C49A22;color:#fff}
.btn-gold:hover{background:#A07A10}
@media print{.hdr,.main-tabs,.hdr-right,.btn,.nav-row,.tabs,.no-print{display:none!important}.card{border:none}}
/* WELCOME SCREEN */
.welcome-screen{position:fixed;inset:0;z-index:999;background:linear-gradient(160deg,#3D1200 0%,#6B2400 55%,#8B4000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center}
.welcome-logo-circle{width:130px;height:130px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 8px 40px rgba(0,0,0,0.35)}
.welcome-logo-text{font-size:32px;font-weight:700;color:var(--brown);letter-spacing:-1px;line-height:1}
.welcome-logo-sub{font-size:11px;font-weight:600;color:var(--brown);letter-spacing:0.1em;text-transform:uppercase;margin-top:2px}
.welcome-brand{color:#C49A22;font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px}
.welcome-title{color:#fff;font-size:26px;font-weight:700;margin-bottom:6px;letter-spacing:-0.3px}
.welcome-subtitle{color:rgba(255,255,255,0.6);font-size:13px;line-height:1.6;max-width:280px;margin:0 auto 36px}
.welcome-btn{background:#fff;color:var(--brown);border:none;padding:15px 44px;border-radius:30px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);box-shadow:0 4px 24px rgba(0,0,0,0.25);letter-spacing:0.01em}
.welcome-btn:active{transform:scale(0.97)}
.welcome-footer{color:rgba(255,255,255,0.25);font-size:11px;margin-top:36px;letter-spacing:0.05em}
</style>
</head>
<body>
<!-- WELCOME SCREEN -->

}

  });

}

// ── STOCK ENTRY ───────────────────────────────────────────────────────────────
function getOutletCats() {
  const disabled = DISABLED_BY_OUTLET[S.outlet] || [];
  const disabledProds = DB.outletConfig[S.outlet] || {};
  return CAT_ORDER
    .filter(catId => !disabled.includes(catId))
    .map(catId => {
      const prods = DB.products
        .filter(p => p.category_id===catId)
        .filter(p => disabledProds[p.id]!==false)
        .filter(p => !DISCONTINUED.includes(p.name));
      return {id:catId, label:CAT_LABELS[catId], products:prods};
    })
    .filter(c => c.products.length > 0);
}

function calcCl(catId, prodId) {
  const d = (S.stockData[catId]||{})[prodId] || {};
  // Expiry does NOT reduce closing — it is tracked as wastage only
  return Math.max(0,(+d.opening||0)+(+d.incoming||0)-(+d.dineIn||0)-(+d.swiggy||0)-(+d.zomato||0));
}

function setStock(catId, prodId, field, val) {
  if (!S.stockData[catId]) S.stockData[catId]={};
  if (!S.stockData[catId][prodId]) S.stockData[catId][prodId]={};
  S.stockData[catId][prodId][field]=val;
  const cl=calcCl(catId,prodId);
  const el=document.getElementById(`cl_${catId}_${prodId}`);
  if(el) el.value=cl||'';
}

  const rows = cat.products.map(p => {
    const d = (S.stockData[cat.id]||{})[p.id]||{};
    const cl = calcCl(cat.id, p.id);
    const isMorn = S.shift==='morning';
    return `<div class="prod-row">

      <div class="g5">
        <div class="fg"><label>Opening</label><input type="number" min="0" value="${d.opening||''}" placeholder="0" oninput="setStock('${cat.id}',${p.id},'opening',this.value)" ${!isMorn?'class="ro" readonly':''}></div>

        <div class="fg"><label>Exp qty</label><input type="number" min="0" value="${d.expiryQty||''}" placeholder="0" oninput="setStock('${cat.id}',${p.id},'expiryQty',this.value)"></div>
        <div class="fg"><label>Exp date</label><input type="date" value="${d.expiryDate||''}" oninput="setStock('${cat.id}',${p.id},'expiryDate',this.value)" style="font-size:10px;padding:5px 1px"></div>
        <div class="fg"><label>Closing</label><input id="cl_${cat.id}_${p.id}" class="cl" type="number" value="${cl||''}" readonly></div>
      </div>
      <div class="sales-lbl">Sales</div>
      <div class="g3">
        <div class="fg"><label style="color:var(--brown)">Dine-in</label><input type="number" min="0" value="${d.dineIn||''}" placeholder="0" oninput="setStock('${cat.id}',${p.id},'dineIn',this.value)" style="border-color:var(--brown)"></div>
        <div class="fg"><label style="color:#E07000">Swiggy</label><input type="number" min="0" value="${d.swiggy||''}" placeholder="0" oninput="setStock('${cat.id}',${p.id},'swiggy',this.value)" style="border-color:#E07000"></div>
        <div class="fg"><label style="color:#D92B3A">Zomato</label><input type="number" min="0" value="${d.zomato||''}" placeholder="0" oninput="setStock('${cat.id}',${p.id},'zomato',this.value)" style="border-color:#D92B3A"></div>

}

// ── DEMAND (night shift only) ─────────────────────────────────────────────────
function renderDemand() {
  const isRoya = S.outlet === '1001';
  const dayLabel = isWeekend() ? 'Weekend' : 'Weekday';
  const cats = getOutletCats().filter(c=>['half_cakes','one_cakes','pastry','brownies','eggless','medovik','eclair'].includes(c.id));
  const rows = cats.map(cat => {
    const isHalfCakes = cat.id === 'half_cakes';
    const showPar = isRoya && isHalfCakes;
    // Header row — extra Par & Req columns for Royapettah cakes
    const colStyle = showPar
      ? 'grid-template-columns:1fr 46px 52px 60px'
      : 'grid-template-columns:1fr 52px 70px';
    const hdrExtra = showPar
      ? `<div style="font-size:9px;color:var(--brown);font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:center">Par</div>
         <div style="font-size:9px;color:var(--green);font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:center">Req</div>`
      : '';
    const productRows = cat.products.map(p => {
      const cl = calcCl(cat.id, p.id);
      const par = showPar ? getParStock(p.name) : null;
      const req = par !== null ? Math.max(0, par - cl) : null;
      // Auto-fill demand with required qty for Royapettah cakes
      if (req !== null && !S.demandData[p.id]) {
        S.demandData[p.id] = String(req);
      }
      const clColor = cl===0 ? 'var(--red)' : cl<=2 ? 'var(--orange)' : 'var(--txt2)';
      const parCell = showPar
        ? `<div style="text-align:center;font-size:12px;font-family:var(--mono);color:var(--brown);font-weight:600">${par!==null?par:'—'}</div>
           <div style="text-align:center;font-size:12px;font-family:var(--mono);color:var(--green);font-weight:700">${req!==null?req:'—'}</div>`
        : '';
      return `<div class="demand-row" style="display:grid;${colStyle};gap:0;align-items:center">
        <div class="demand-name" style="font-size:12px">${p.name}</div>
        <div style="text-align:center;font-size:13px;font-weight:600;font-family:var(--mono);color:${clColor}">${cl}</div>
        ${parCell}
        <div style="text-align:center"><input class="demand-input" type="number" min="0" placeholder="0" value="${S.demandData[p.id]||''}" oninput="S.demandData[${p.id}]=this.value" style="width:58px"></div>
      </div>`;
    }).join('');
    const parNote = showPar ? `<div style="font-size:11px;color:var(--brown);margin-bottom:6px">📊 Par stock shown (${dayLabel}). Required qty auto-calculated.</div>` : '';
    return `
    <div class="sec-hdr">${cat.label}</div>
    ${parNote}
    <div style="display:grid;${colStyle};gap:0;padding:4px 0 2px;border-bottom:1px solid var(--border2)">
      <div style="font-size:9px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.04em">Product</div>
      <div style="font-size:9px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:center">Closing</div>
      ${hdrExtra}
      <div style="font-size:9px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:center">Confirm</div>
    </div>
    ${productRows}`;
  }).join('');
  document.getElementById('screen').innerHTML = `
  <div style="margin-top:12px">

// ── SUBMIT ────────────────────────────────────────────────────────────────────
async function submitShift() {
  const btns = document.querySelectorAll('.btn-p');
  btns.forEach(b=>{b.disabled=true;});
  const first = document.querySelector('.btn-p');
  if(first) first.textContent = 'Saving...';
  try {
    const today = new Date().toISOString().split('T')[0];

    // ── DUPLICATE PREVENTION ──────────────────────────────────────────────────
    // Check if a REAL entry already exists for this outlet+shift+date
    const existing = await sbGet('shift_entries',
      `?outlet_id=eq.${S.outlet}&entry_date=eq.${today}&shift=eq.${S.shift}&is_demo=eq.false&select=id`);
    if (existing.length > 0) {
      // Ask before overwriting
      const ok = confirm(
        `A ${S.shift} shift entry for ${S.outletName} already exists today.\n\nDo you want to replace it with this new submission?`
      );
      if (!ok) {
        btns.forEach(b=>{b.disabled=false;});
        if(first) first.textContent = S.shift==='night' ? '✓ Submit night shift' : '✓ Submit shift';
        return;
      }
      // Delete the old entry (stock_lines cascade via FK)
      await sbDelete('shift_entries', `?id=eq.${existing[0].id}`);
      // Also remove old demand requests for this outlet+tomorrow if night shift
      if (S.shift === 'night') {
        const tmrwCheck = new Date(); tmrwCheck.setDate(tmrwCheck.getDate()+1);
        const tmrwCheckStr = tmrwCheck.toISOString().split('T')[0];
        await sbDelete('demand_requests',
          `?outlet_id=eq.${S.outlet}&entry_date=eq.${tmrwCheckStr}`);
      }
    }

    // ── SAVE NEW ENTRY ────────────────────────────────────────────────────────
    const entries = await sbPost('shift_entries',[{
      outlet_id:S.outlet, entry_date:today,
      shift:S.shift, staff_name:S.staffName,
      is_demo:false  // real entry
    }]);
    const entryId = entries[0].id;
    const lines = [];
    Object.entries(S.stockData).forEach(([catId,prods])=>{
      Object.entries(prods).forEach(([prodId,d])=>{
        if(Object.values(d).some(v=>v&&v!=='')) {
          lines.push({entry_id:entryId,product_id:parseInt(prodId),
            opening:+d.opening||0,incoming:+d.incoming||0,
            dine_in:+d.dineIn||0,swiggy:+d.swiggy||0,zomato:+d.zomato||0,
            expiry_qty:+d.expiryQty||0,expiry_date:d.expiryDate||null});
        }
      });
    });
    if(lines.length) await sbPost('stock_lines',lines);
    // Only save demand requests for night shift
    if (S.shift === 'night') {
      const demands=[];
      const tmrw=new Date(); tmrw.setDate(tmrw.getDate()+1);
      const tmrwStr=tmrw.toISOString().split('T')[0];
      Object.entries(S.demandData).forEach(([prodId,qty])=>{
        if(qty&&+qty>0) demands.push({outlet_id:S.outlet,entry_date:tmrwStr,product_id:parseInt(prodId),requested_qty:+qty});
      });
      if(demands.length) await sbPost('demand_requests',demands);
    }
    renderSuccess();
  } catch(e) {
    toast('Error saving. Please try again.');
    const btns2=document.querySelectorAll('.btn-p');
    btns2.forEach(b=>{b.disabled=false;});
    const first2=document.querySelector('.btn-p');
    if(first2) first2.textContent = S.shift==='night' ? '✓ Submit night shift' : '✓ Submit shift';
  }
}

// ── SUCCESS ───────────────────────────────────────────────────────────────────
function renderSuccess() {
  const shiftTimes={morning:'9:30 AM – 6:30 PM',evening:'2:30 PM – 11:00 PM',night:'6:30 PM – 3:00 AM'};
  let totalSold=0,wasteVal=0,expiryLines=[];
  Object.entries(S.stockData).forEach(([catId,prods])=>{
    Object.entries(prods).forEach(([prodId,d])=>{
      const sold=(+d.dineIn||0)+(+d.swiggy||0)+(+d.zomato||0);
      totalSold+=sold;
      const wq=+d.expiryQty||0;
      if(wq>0){
        const prod=DB.products.find(p=>p.id==prodId);
        const price=prod?.price||0;
        wasteVal+=wq*price;
        expiryLines.push(`<div class="alert-row"><div class="alert-dot" style="background:var(--red)"></div><div><div class="alert-title">${prod?.name||'Product'}</div><div class="alert-sub">${wq} expired · ₹${wq*price} lost</div></div></div>`);
      }
    });
  });
  document.getElementById('screen').innerHTML = `
  <div class="success-wrap">
    <div class="success-icon">✓</div>
    <h2 style="font-size:18px;font-weight:600;margin-bottom:8px">Shift submitted!</h2>
    <p style="font-size:14px;color:var(--txt2);margin-bottom:4px">${S.outletName} — ${S.shift} shift</p>
    <p style="font-size:12px;color:var(--txt3);margin-bottom:16px">${shiftTimes[S.shift]}</p>
    <div class="card" style="text-align:left">
      <div class="card-title">Shift summary</div>
      <div style="display:flex;gap:20px;margin-bottom:${expiryLines.length?12:0}px">
        <div><div style="font-size:20px;font-weight:600;font-family:var(--mono)">${totalSold}</div><div style="font-size:11px;color:var(--txt3)">Units sold</div></div>
        <div><div style="font-size:20px;font-weight:600;font-family:var(--mono);color:var(--red)">₹${wasteVal}</div><div style="font-size:11px;color:var(--txt3)">Wastage value</div></div>
      </div>
      ${expiryLines.length?'<div class="card-title">Expiry</div>'+expiryLines.join(''):'<div style="font-size:13px;color:var(--green)">✓ No expiry today</div>'}
    </div>
    <button class="btn btn-p" style="max-width:220px;margin:16px auto 0" onclick="goHome()">🏠 Back to Home</button>
  </div>`;
}

// ── OVERVIEW ──────────────────────────────────────────────────────────────────
async function renderOverview() {
  setHdr('Dashboard', true);
  showLoading("Loading today's data...");
  try {
    const today=new Date().toISOString().split('T')[0];
    // Fetch both real and demo entries separately
    const entries=await sbGet('shift_entries',`?entry_date=eq.${today}&is_demo=eq.false&select=*,stock_lines(*,products(name,price))`);
    const demoEntries=await sbGet('shift_entries',`?entry_date=eq.${today}&is_demo=eq.true&select=id&limit=1`);
    const hasDemoData = demoEntries.length > 0;
    const byOutlet={};
    entries.forEach(e=>{
      if(!byOutlet[e.outlet_id]) byOutlet[e.outlet_id]={shifts:[],lines:[]};
      byOutlet[e.outlet_id].shifts.push(e.shift);
      (e.stock_lines||[]).forEach(l=>byOutlet[e.outlet_id].lines.push(l));
    });
    let totalSold=0,totalWaste=0,allAlerts=[];
    const outletRows=Object.entries(OUTLET_PINS).map(([pin,name])=>{
      const data=byOutlet[pin]||{shifts:[],lines:[]};
      const shiftsCount=new Set(data.shifts).size;
      let critical=0,low=0,expiring=0,outletSold=0;
      data.lines.forEach(l=>{
        const sold=(+l.dine_in||0)+(+l.swiggy||0)+(+l.zomato||0);
        outletSold+=sold;
        const cl=+l.closing||0;
        if(cl===0&&sold>0) critical++;
        else if(cl<=2&&cl>0) low++;
        if(+l.expiry_qty>0){
          expiring++;
          const lv=(+l.expiry_qty)*(+l.products?.price||0);
          totalWaste+=lv;
          allAlerts.push({prod:l.products?.name,outlet:name,qty:l.expiry_qty,val:lv});
        }
      });
      totalSold+=outletSold;
      const dotClass=shiftsCount===0?'dot-r':shiftsCount<3?'dot-o':'dot-g';
      return `<div class="outlet-row" onclick="showOutletDetail('${pin}','${name}')">
        <div class="dot ${dotClass}"></div>
        <div class="outlet-name">${name}${pin==='1001'?' ⭐':''}</div>
        <div class="badges-wrap">
          ${shiftsCount?`<span class="badge b-brown">${shiftsCount}/3</span>`:'<span class="badge b-gray">No data</span>'}
          ${critical?`<span class="badge b-red">🔴 ${critical}</span>`:''}
          ${low?`<span class="badge b-orange">🟡 ${low}</span>`:''}
          ${expiring?`<span class="badge b-red">⚠️ ${expiring}</span>`:''}
        </div>
      </div>`;
    }).join('');
    const alertHtml=allAlerts.length?`<div class="card"><div class="card-title">⚠️ Expiry alerts today</div>${allAlerts.map(a=>`<div class="alert-row"><div class="alert-dot" style="background:var(--red)"></div><div><div class="alert-title">${a.prod}</div><div class="alert-sub">${a.outlet} · ${a.qty} units · ₹${a.val} lost</div></div></div>`).join('')}</div>`:'';
    document.getElementById('screen').innerHTML=`
    <div style="margin-top:12px">
      ${hasDemoData?`<div class="demo-banner">⚠️ Demo data exists for today. It is hidden from this view and does NOT affect production. Use "Clear demo data" below to remove it.</div>`:''}
      <div class="dash-grid">
        <div class="metric-card"><div class="mv">${totalSold}</div><div class="ml">Units sold today</div></div>
        <div class="metric-card"><div class="mv" style="color:var(--red)">₹${totalWaste}</div><div class="ml">Wastage today</div></div>
      </div>
      <div class="card"><div class="card-title">All outlets — ${new Date().toLocaleDateString('en-GB')}</div>${outletRows}</div>
      ${alertHtml}
      <div class="card">
        <div class="card-title">🎯 Load demo data — all outlets</div>
        <p style="font-size:13px;color:var(--txt2);margin-bottom:10px">Populate all 8 outlets with sample data for testing and presentation.</p>
        <button class="btn btn-gold no-print" onclick="loadAllDemoData()">Load demo data for all outlets</button>
      </div>
      <div class="card no-print">
        <div class="card-title" style="color:var(--red)">🗑 Clear demo data</div>
        <p style="font-size:13px;color:var(--txt2);margin-bottom:10px">Remove demo/test entries only. Real outlet submissions are never touched.</p>
        <button class="btn btn-danger" onclick="clearTestData()">Clear demo data</button>
      </div>
    </div>`;
  } catch(e){ document.getElementById('screen').innerHTML=`<div class="card" style="margin-top:14px"><p style="color:var(--red);font-size:13px">Error loading data.</p></div>`; }
}

async function clearTestData() {
  if(!confirm('Clear all DEMO/TEST entries for today? Real outlet submissions will NOT be affected.')) return;
  try {
    const today=new Date().toISOString().split('T')[0];
    // Only delete entries where is_demo = true
    await sbDelete('shift_entries',`?entry_date=eq.${today}&is_demo=eq.true`);
    // Delete demand requests created by demo (staff_name = 'Demo Staff')
    // demand_requests don't have is_demo, so we delete by cross-referencing
    // For safety, only delete tomorrow's demands that match demo outlets pattern
    const tmrw=new Date(); tmrw.setDate(tmrw.getDate()+1);
    const tmrwStr=tmrw.toISOString().split('T')[0];
    // Check if any real night shifts exist for tomorrow — if not safe to clear
    const realNight=await sbGet('shift_entries',
      `?entry_date=eq.${today}&shift=eq.night&is_demo=eq.false&select=id`);
    if(realNight.length===0){
      // No real night shifts submitted yet — safe to clear all tomorrow demands
      await sbDelete('demand_requests',`?entry_date=eq.${tmrwStr}`);
      toast('Demo data cleared ✓ (no real night shifts found)');
    } else {
      toast('Demo shift entries cleared ✓ (tomorrow demands kept — real night shifts exist)');
    }
    renderOverview();
  } catch(e){ toast('Error clearing data: '+e.message); }
}

async function loadAllDemoData() {
  const btn = document.querySelector('.btn-gold');
  if(btn){btn.disabled=true;btn.textContent='Loading...';}
  try {
    const today = new Date().toISOString().split('T')[0];
    const tmrw = new Date(); tmrw.setDate(tmrw.getDate()+1);
    const tmrwStr = tmrw.toISOString().split('T')[0];
    const d0 = today;
    const d1 = tmrw.toISOString().split('T')[0];
    const d2 = new Date(new Date().setDate(new Date().getDate()+2)).toISOString().split('T')[0];
    const expiryDates = [d0, d1, d2];
    for (const [pin, name] of Object.entries(OUTLET_PINS)) {
      const disabled = DISABLED_BY_OUTLET[pin]||[];
      const disabledProds = DB.outletConfig[pin]||{};
      for (const shift of ['morning','evening','night']) {
        const ent = await sbPost('shift_entries',[{outlet_id:pin,entry_date:today,shift,staff_name:'Demo Staff',is_demo:true}]);
        const entryId = ent[0].id;
        const lines = [];
        CAT_ORDER.filter(c=>!disabled.includes(c)).forEach(catId=>{
          const prods = DB.products.filter(p=>p.category_id===catId&&disabledProds[p.id]!==false&&!DISCONTINUED.includes(p.name));
          const d = DUMMY[catId]||DUMMY.brownies;
          prods.forEach((p,idx)=>{
            const v=idx%3;
            const expIdx=idx%3;
            lines.push({entry_id:entryId,product_id:p.id,
              opening:d.opening-v, incoming:d.incoming,
              dine_in:d.dineIn, swiggy:d.swiggy,
              zomato:Math.max(0,d.zomato-(v>1?1:0)),
              expiry_qty: expIdx===0?1:0,
              expiry_date: expIdx===0?expiryDates[idx%3]:null});
          });
        });
        if(lines.length) await sbPost('stock_lines',lines);
        if(shift==='night'){
          const demands=[];
          CAT_ORDER.filter(c=>!disabled.includes(c)).forEach(catId=>{
            const prods=DB.products.filter(p=>p.category_id===catId&&disabledProds[p.id]!==false&&!DISCONTINUED.includes(p.name));
            const d=DUMMY[catId]||DUMMY.brownies;
            prods.forEach(p=>{
              const cl=Math.max(0,d.opening+d.incoming-d.dineIn-d.swiggy-d.zomato-0);
              demands.push({outlet_id:pin,entry_date:tmrwStr,product_id:p.id,requested_qty:cl+2});
            });
          });
          if(demands.length) await sbPost('demand_requests',demands);
        }
      }
    }
    toast('Demo data loaded for all 8 outlets ✓');
    renderOverview();
  } catch(e) {
    toast('Error: '+e.message);
    const btn2=document.querySelector('.btn-gold');
    if(btn2){btn2.disabled=false;btn2.textContent='Load demo data for all outlets';}
  }
}

function renderProductionUI() {
  const lists = [
    {id:'cakes_pastry',label:'Cakes & Pastries',cats:['half_cakes','one_cakes','pastry','mini_cups']},
    {id:'brownies_list',label:'Brownies',cats:['brownies','eggless','boxes']},
    {id:'evening_list',label:'Evening Kitchen',cats:['medovik','eclair','tubs','cheesecake','special']}
  ];
  const tabs = lists.map((l,i)=>`<button class="tab ${S.productionTab===i?'active':''}" onclick="S.productionTab=${i};renderProductionUI()">${l.label}</button>`).join('');
  const cur = lists[S.productionTab];
  const prods = DB.products.filter(p=>cur.cats.includes(p.category_id)&&!DISCONTINUED.includes(p.name));
  const morningStock = window._prodMorning||{};
  const dispatched = window._prodDisp||{};
  let lastCat='', tableRows='';
  let gTotMs=0,gTotBal=0,gTotMake=0,gTotCl=0;
  let cTotMs=0,cTotBal=0,cTotMake=0,cTotCl=0;
  let prevCatId='';
  prods.forEach((p,i)=>{
    const pd=(S.productionData[cur.id]||{})[p.id]||{};
    const ms = pd.morning!==undefined ? +pd.morning : (morningStock[p.id]||0);
    const disp = dispatched[p.id]||0;
    const bal = Math.max(0, ms-disp);
    const tm = +pd.toMake||0;
    const cl = bal+tm;
    if(p.category_id!==lastCat){
      if(lastCat){
        tableRows+=`<tr class="ptotal"><td>Subtotal</td><td>${cTotMs}</td><td>${cTotBal}</td><td>${cTotMake}</td><td>${cTotCl}</td></tr>`;
        cTotMs=0;cTotBal=0;cTotMake=0;cTotCl=0;
      }
      tableRows+=`<tr class="pcat"><td colspan="5">${CAT_LABELS[p.category_id]}</td></tr>`;
      lastCat=p.category_id;
    }
    cTotMs+=ms;cTotBal+=bal;cTotMake+=tm;cTotCl+=cl;
    gTotMs+=ms;gTotBal+=bal;gTotMake+=tm;gTotCl+=cl;
    tableRows+=`<tr>

function setProdField(listId,prodId,field,val,disp){
  if(!S.productionData[listId]) S.productionData[listId]={};
  if(!S.productionData[listId][prodId]) S.productionData[listId][prodId]={};
  S.productionData[listId][prodId][field]=+val||0;
  const pd=S.productionData[listId][prodId];
  const ms=pd.morning!==undefined?pd.morning:((window._prodMorning||{})[prodId]||0);
  const bal=Math.max(0,ms-(+disp||0));
  const tm=pd.toMake||0;
  const cl=bal+tm;
  const bEl=document.getElementById(`pb_${listId}_${prodId}`);
  const cEl=document.getElementById(`pc_${listId}_${prodId}`);
  if(bEl) bEl.textContent=bal;
  if(cEl) cEl.textContent=cl||0;
}

// Keep old setProd for compatibility
function setProd(listId,prodId,val){setProdField(listId,prodId,'toMake',val,0);}

async function finaliseProduction(listId,label){
  const today=new Date().toISOString().split('T')[0];
  const entries=Object.entries(S.productionData[listId]||{}).map(([prodId,d])=>({
    list_date:today,list_type:listId,product_id:parseInt(prodId),
    production_qty:+d.toMake||0,
    balance_stock:Math.max(0,(+d.morning||0)-((window._prodDisp||{})[prodId]||0)),
    closing_stock:(Math.max(0,(+d.morning||0)-((window._prodDisp||{})[prodId]||0)))+(+d.toMake||0)
  }));
  try{
    if(entries.length) await sbPost('production_lists',entries);
    toast(label+' list saved ✓');
    if(confirm('Share on WhatsApp?')){
      window.open('https://wa.me/?text='+encodeURIComponent('Brownie Heaven — '+label+' Production List\nDate: '+new Date().toLocaleDateString('en-GB')+'\nstock.brownieheaven.in'));
    }
  }catch(e){toast('Error saving: '+e.message);}
}

async function saveProduction(listId){finaliseProduction(listId,listId);}

async function renderMonthly() {
  setHdr('Dashboard', true);
  showLoading('Loading monthly data...');
  try {
    const monthStr=String(S.selMonth+1).padStart(2,'0');
    const startDate=`${S.selYear}-${monthStr}-01`;
    const endDate=`${S.selYear}-${monthStr}-${new Date(S.selYear,S.selMonth+1,0).getDate()}`;
    const entries=await sbGet('shift_entries',`?entry_date=gte.${startDate}&entry_date=lte.${endDate}&select=*,stock_lines(*,products(name,price))`);
    const dailySales={};
    let totalSold=0,totalWaste=0;
    const prodSales={},prodWaste={};
    entries.forEach(e=>{
      const day=new Date(e.entry_date).getDate();
      if(!dailySales[day]) dailySales[day]=0;
      (e.stock_lines||[]).forEach(l=>{
        const sold=(+l.dine_in||0)+(+l.swiggy||0)+(+l.zomato||0);
        dailySales[day]+=sold; totalSold+=sold;
        const pn=l.products?.name||'Unknown';
        prodSales[pn]=(prodSales[pn]||0)+sold;
        const wq=+l.expiry_qty||0;
        if(wq>0){ const wv=wq*(+l.products?.price||0); totalWaste+=wv; prodWaste[pn]=(prodWaste[pn]||0)+wv; }
      });
    });
    const daysInMonth=new Date(S.selYear,S.selMonth+1,0).getDate();
    const dayVals=Array.from({length:daysInMonth},(_,i)=>dailySales[i+1]||0);
    const maxVal=Math.max(...dayVals,1);
    const bars=dayVals.map((v,i)=>`<div class="bar ${i===new Date().getDate()-1&&S.selMonth===new Date().getMonth()?'active-bar':''}" style="height:${Math.max(3,Math.round(v/maxVal*66))}px" title="Day ${i+1}: ${v}"></div>`).join('');
    const lbls=dayVals.map((_,i)=>`<div class="chart-lbl">${i+1}</div>`).join('');
    const topProds=Object.entries(prodSales).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const deadProds=Object.entries(prodSales).filter(([,v])=>v===0).slice(0,5);
    const topWaste=Object.entries(prodWaste).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const monthTabs=MONTHS_SHORT.map((m,i)=>`<button class="m-tab ${i===S.selMonth?'active':''}" onclick="S.selMonth=${i};renderMonthly()">${m}</button>`).join('');
    document.getElementById('screen').innerHTML=`
    <div style="margin-top:12px">
      <div class="month-tabs">${monthTabs}</div>
      <div class="three-grid">
        <div class="sm-card"><div class="sm-val">${totalSold}</div><div class="sm-lbl">Units sold</div></div>
        <div class="sm-card"><div class="sm-val" style="color:var(--red)">₹${totalWaste}</div><div class="sm-lbl">Wastage</div></div>
        <div class="sm-card"><div class="sm-val">${daysInMonth>0?Math.round(totalSold/daysInMonth):0}</div><div class="sm-lbl">Daily avg</div></div>
      </div>
      <div class="card">
        <div class="card-title">Daily sales — ${MONTHS[S.selMonth]} ${S.selYear}</div>
        <div class="chart-bars">${bars}</div>
        <div class="chart-lbls">${lbls}</div>
      </div>
      <div class="card">
        <div class="card-title">Top 5 products this month</div>
        ${topProds.length?topProds.map(([n,v],i)=>`<div class="tp-row"><div class="tp-rank">${i+1}</div><div class="tp-name">${n}</div><div class="tp-val">${v} units</div></div>`).join(''):'<p style="font-size:13px;color:var(--txt3)">No data yet.</p>'}
      </div>
      ${topWaste.length?`<div class="card"><div class="card-title">Top wastage this month</div>${topWaste.map(([n,v],i)=>`<div class="tp-row"><div class="tp-rank">${i+1}</div><div class="tp-name">${n}</div><div class="tp-val" style="color:var(--red)">₹${v}</div></div>`).join('')}</div>`:''}
      ${deadProds.length?`<div class="card"><div class="card-title">Dead stock (0 sales)</div>${deadProds.map(([n],i)=>`<div class="tp-row"><div class="tp-rank">${i+1}</div><div class="tp-name">${n}</div><div class="tp-val" style="color:var(--txt3)">0 units</div></div>`).join('')}</div>`:''}
      <button class="share-btn pdf-btn" onclick="window.print()">📄 Download PDF Report</button>
      <button class="share-btn wa-btn" onclick="window.open('https://wa.me/?text='+encodeURIComponent('Brownie Heaven — ${MONTHS[S.selMonth]} ${S.selYear} Report\nstock.brownieheaven.in'))">📱 Share on WhatsApp</button>
    </div>`;
  } catch(e){ document.getElementById('screen').innerHTML=`<div class="card" style="margin-top:14px"><p style="color:var(--red);font-size:13px">Error loading monthly data.</p></div>`; }
}

function toggleCat(pin,catId,active){
  if(!DISABLED_BY_OUTLET[pin]) DISABLED_BY_OUTLET[pin]=[];
  const dc=DISABLED_BY_OUTLET[pin];
  if(!active&&!dc.includes(catId)) dc.push(catId);
  else if(active) DISABLED_BY_OUTLET[pin]=dc.filter(c=>c!==catId);
  renderAdmin();
}
async function toggleProd(pin,prodId,active){
  if(!DB.outletConfig[pin]) DB.outletConfig[pin]={};
  DB.outletConfig[pin][prodId]=active;
  try{ await sbPost('outlet_product_config',[{outlet_id:pin,product_id:prodId,is_active:active}]); toast(active?'Product enabled ✓':'Product disabled'); }
  catch(e){ toast('Error updating config'); }
}
async function updatePrice(prodId,val){
  const prod=DB.products.find(p=>p.id===prodId);
  if(prod){ prod.price=+val;
    try{ await sbPatch('products',`?id=eq.${prodId}`,{price:+val}); toast('Price updated ✓'); }
    catch(e){ toast('Error updating price'); }
  }
}
async function addProd(catId){
  const name=(S.newProdName[catId]||'').trim();
  if(!name) return;
  try{
    const res=await sbPost('products',[{name,category_id:catId,price:0,sort_order:999}]);
    DB.products.push(res[0]); S.newProdName[catId]='';
    toast('Product added ✓'); renderAdmin();
  } catch(e){ toast('Error adding product'); }
}

let SL={outlet:'',date:new Date().toISOString().slice(0,10),lines:{},view:'entry',history:[],filterOutlet:'',filterDate:'',editKey:null};

function slFmt(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function slSafeId(name){return name.replace(/[^a-zA-Z0-9]/g,'_');}
function slGetLine(name){
  if(!SL.lines[name]){const def=SL_CATALOG.flatMap(g=>g.items).find(p=>p.name===name);SL.lines[name]={qty:'',rate:def?def.rate:0,amount:0};}
  return SL.lines[name];
}
function slCalcDaily(){return Object.values(SL.lines).reduce((s,l)=>s+(l.amount||0),0);}

async function slMonthlyTotal(){
  if(!SL.outlet||!SL.date)return slCalcDaily();
  const ym=SL.date.slice(0,7);const[y,m]=ym.split('-');
  const last=new Date(+y,+m,0).getDate();
  try{
    const rows=await sbGet('outlet_supply_ledger',`?outlet=eq.${encodeURIComponent(SL.outlet)}&date=gte.${ym}-01&date=lte.${ym}-${last}&select=amount`);
    return rows.reduce((s,r)=>s+Number(r.amount||0),0)+slCalcDaily();
  }catch(e){return slCalcDaily();}
}

async function slLoadHistory(){
  try{
    let q='outlet_supply_ledger?order=date.desc,outlet,category,product';
    if(SL.filterOutlet)q+=`&outlet=eq.${encodeURIComponent(SL.filterOutlet)}`;
    if(SL.filterDate)q+=`&date=eq.${SL.filterDate}`;
    SL.history=await sbGet(q);
  }catch(e){SL.history=[];}
}

async function slExport(){
  try{
    let q='outlet_supply_ledger?order=date.desc,outlet,product';
    if(SL.filterOutlet)q+=`&outlet=eq.${encodeURIComponent(SL.filterOutlet)}`;
    if(SL.filterDate)q+=`&date=eq.${SL.filterDate}`;
    const rows=await sbGet(q);
    if(!rows.length){toast('No data to export');return;}
    const headers=['Date','Outlet','Category','Product','Qty','Rate','Amount'];
    const csv=[headers.join(','),...rows.map(r=>[
      r.date,r.outlet,'"'+(r.category||'')+'"','"'+r.product+'"',r.qty,r.rate,r.amount
    ].join(','))].join('\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='BH_Supply_'+(SL.filterOutlet||'All')+'_'+(SL.filterDate||new Date().toISOString().slice(0,7))+'.csv';
    a.click();
    toast('Downloaded! Open in Excel');
  }catch(e){toast('Error: '+e.message);}
}

function slUpdateLine(name,field,val){
  const l=slGetLine(name);l[field]=val;
  const q=Number(l.qty)||0,r=Number(l.rate)||0;l.amount=q*r;
  const el=document.getElementById('sl-amt-'+slSafeId(name));
  if(el)el.textContent=q>0?slFmt(l.amount):'—';
  const daily=slCalcDaily();
  const dt=document.getElementById('sl-daily-total');if(dt)dt.textContent=slFmt(daily);
  const dd=document.getElementById('sl-daily-disp');if(dd)dd.textContent=slFmt(daily);
  slMonthlyTotal().then(mt=>{const me=document.getElementById('sl-monthly-disp');if(me)me.textContent=slFmt(mt);});
}

function slGroupHistory(){
  const g={};
  SL.history.forEach(r=>{const k=r.outlet+'|'+r.date;if(!g[k])g[k]={outlet:r.outlet,date:r.date,rows:[],total:0};g[k].rows.push(r);g[k].total+=Number(r.amount||0);});
  return Object.values(g).sort((a,b)=>b.date.localeCompare(a.date)||a.outlet.localeCompare(b.outlet));
}

async function renderSupplyLedger(){
  setHdr('Dashboard',true);
  if(!SL.history.length)await slLoadHistory();
  const daily=slCalcDaily();
  const groups=slGroupHistory();
const monthLabel=SL.date?new Date(SL.date.slice(0,7)+'-01').toLocaleString('en-IN',{month:'long',year:'numeric'}):'';

  let prodHTML='';
  SL_CATALOG.forEach(function(group){
    var sub=0;
    var rowsHtml=group.items.map(function(p){
      var l=slGetLine(p.name);var hasQty=Number(l.qty)>0;sub+=l.amount||0;var sid=slSafeId(p.name);
      return '<tr style="'+(hasQty?'background:#f0fbf7':'')+'">'
        +'<td style="padding:5px 8px;font-size:13px;border-bottom:.5px solid #f0f0ee">'+p.name+'</td>'
        +'<td style="padding:4px 5px;border-bottom:.5px solid #f0f0ee">'
        +'<input type="number" min="0" step="1" placeholder="0" value="'+(l.qty||'')+'"'
        +' style="width:100%;font-size:13px;padding:4px 5px;border:.5px solid #d5d5d0;border-radius:4px;text-align:right;font-family:var(--mono)"'
        +' oninput="slUpdateLine(\''+p.name+'\',\'qty\',this.value)"></td>'
        +'<td style="padding:4px 5px;border-bottom:.5px solid #f0f0ee">'
        +'<input type="number" min="0" step="0.01" value="'+(l.rate||p.rate)+'"'
        +' style="width:100%;font-size:13px;padding:4px 5px;border:.5px solid #d5d5d0;border-radius:4px;text-align:right;font-family:var(--mono)"'
        +' oninput="slUpdateLine(\''+p.name+'\',\'rate\',this.value)"></td>'
        +'<td id="sl-amt-'+sid+'" style="padding:5px 8px;text-align:right;font-size:13px;font-family:var(--mono);border-bottom:.5px solid #f0f0ee;color:'+(hasQty?'#0F6E56':'#bbb')+'">'+(hasQty?slFmt(l.amount):'—')+'</td>'
        +'</tr>';
    }).join('');
    prodHTML+='<div style="margin-bottom:1rem">'
      +'<div style="font-size:11px;font-weight:600;color:#1D9E75;text-transform:uppercase;letter-spacing:.05em;padding:6px 0 4px;border-bottom:1px solid #E1F5EE">'+group.cat+'</div>'
      +'<div style="border:.5px solid #e5e5e3;border-radius:0 0 8px 8px;overflow:hidden">'
      +'<table style="width:100%;border-collapse:collapse;table-layout:fixed">'
      +'<colgroup><col style="width:40%"><col style="width:20%"><col style="width:20%"><col style="width:20%"></colgroup>'
      +'<tbody>'+rowsHtml+'</tbody>'
      +'<tfoot><tr style="background:#f7f7f5">'
      +'<td colspan="3" style="padding:5px 8px;font-size:12px;font-weight:500">Subtotal</td>'
      +'<td style="padding:5px 8px;text-align:right;font-size:12px;font-weight:500;font-family:var(--mono)">'+slFmt(sub)+'</td>'
      +'</tr></tfoot></table></div></div>';
  });

  var histHTML='';
  if(SL.view==='history'){
    if(!groups.length){
      histHTML='<p style="color:var(--txt3);font-size:13px;text-align:center;padding:2rem">No entries found.</p>';
    }else{
      histHTML=groups.map(function(g){
        var rowsHtml=g.rows.map(function(r){
          return '<tr><td style="padding:5px 10px;font-size:12px">'+(r.category||'')+'</td>'
            +'<td style="padding:5px 10px;font-size:12px">'+r.product+'</td>'
            +'<td style="padding:5px 10px;text-align:right;font-family:var(--mono);font-size:12px">'+r.qty+'</td>'
            +'<td style="padding:5px 10px;text-align:right;font-family:var(--mono);font-size:12px">'+Number(r.rate).toFixed(2)+'</td>'
            +'<td style="padding:5px 10px;text-align:right;font-family:var(--mono);font-size:12px">'+slFmt(r.amount)+'</td></tr>';
        }).join('');
        var encoded=encodeURIComponent(JSON.stringify(g.rows));
        return '<div style="border:.5px solid #e5e5e3;border-radius:8px;overflow:hidden;margin-bottom:8px;background:white">'
          +'<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;background:#fafaf8" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\'">'
          +'<div><span style="font-weight:500;font-size:14px;margin-right:8px">'+g.outlet+'</span>'
          +'<span style="font-size:12px;color:#888">'+g.date+'</span>'
          +'<span style="font-size:11px;color:#aaa;margin-left:6px">'+g.rows.length+' products</span></div>'
          +'<div style="display:flex;align-items:center;gap:10px">'
          +'<span style="font-weight:600;font-size:15px;color:#0F6E56;font-family:var(--mono)">'+slFmt(g.total)+'</span>'
          +'<span style="color:#aaa;font-size:11px">▼</span></div></div>'
          +'<div style="display:none">'
          +'<table style="width:100%;border-collapse:collapse">'
          +'<thead><tr style="background:#f7f7f5">'
          +'<th style="padding:6px 10px;font-size:11px;font-weight:500;color:#888;text-align:left">Category</th>'
          +'<th style="padding:6px 10px;font-size:11px;font-weight:500;color:#888;text-align:left">Product</th>'
          +'<th style="padding:6px 10px;font-size:11px;font-weight:500;color:#888;text-align:right">Qty</th>'
          +'<th style="padding:6px 10px;font-size:11px;font-weight:500;color:#888;text-align:right">Rate</th>'
          +'<th style="padding:6px 10px;font-size:11px;font-weight:500;color:#888;text-align:right">Amount</th>'
          +'</tr></thead><tbody>'+rowsHtml+'</tbody>'
          +'<tfoot><tr style="background:#f7f7f5;font-weight:600">'
          +'<td colspan="4" style="padding:6px 10px">Total</td>'
          +'<td style="padding:6px 10px;text-align:right;font-family:var(--mono)">'+slFmt(g.total)+'</td>'
          +'</tr></tfoot></table>'
          +'<div style="display:flex;gap:8px;padding:10px 14px;border-top:.5px solid #f0f0ee">'
          +'<button onclick="slEdit(\''+encoded+'\')" style="font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;border:.5px solid #1D9E75;color:#0F6E56;background:none;font-family:var(--font)">Edit</button>'
          +'<button onclick="slDelete(\''+g.outlet+'\',\''+g.date+'\')" style="font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;border:.5px solid #e24b4a;color:#e24b4a;background:none;font-family:var(--font)">Delete</button>'
          +'</div></div></div>';
      }).join('');
    }
  }

  var outletOptions=SL_OUTLETS.map(function(o){return '<option value="'+o+'" '+(SL.outlet===o?'selected':'')+'>'+o+'</option>';}).join('');
  var filterOptions=SL_OUTLETS.map(function(o){return '<option value="'+o+'" '+(SL.filterOutlet===o?'selected':'')+'>'+o+'</option>';}).join('');

  document.getElementById('screen').innerHTML=
    '<div style="padding:0 0 3rem">'

    // View toggle tabs
    +'<div style="display:flex;gap:2px;border-bottom:1px solid #e5e5e3;margin-bottom:1.5rem;margin-top:12px">'
    +'<button onclick="SL.view=\'entry\';renderSupplyLedger()" style="padding:8px 14px;font-size:13px;cursor:pointer;background:none;border:none;border-bottom:'+(SL.view==='entry'?'2px solid #1D9E75':'2px solid transparent')+';color:'+(SL.view==='entry'?'#0F6E56':'#888')+';font-weight:'+(SL.view==='entry'?'500':'400')+';margin-bottom:-1px;font-family:var(--font)">New entry'+(SL.editKey?' (editing)':'')+'</button>'
    +'<button onclick="SL.view=\'history\';slLoadHistory().then(function(){renderSupplyLedger();})" style="padding:8px 14px;font-size:13px;cursor:pointer;background:none;border:none;border-bottom:'+(SL.view==='history'?'2px solid #1D9E75':'2px solid transparent')+';color:'+(SL.view==='history'?'#0F6E56':'#888')+';font-weight:'+(SL.view==='history'?'500':'400')+';margin-bottom:-1px;font-family:var(--font)">History '+(groups.length?'('+groups.length+')':'')+'</button>'
    +'</div>'

    +(SL.view==='entry'?
      // ENTRY VIEW
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem">'
      +'<div><label style="font-size:12px;color:#666;font-weight:500;display:block;margin-bottom:4px">Outlet</label>'
      +'<select onchange="SL.outlet=this.value" style="width:100%;font-size:14px;padding:8px 10px;border-radius:8px;border:.5px solid #d5d5d0;background:white;color:var(--txt);font-family:var(--font)">'
      +'<option value="">Select outlet...</option>'+outletOptions+'</select></div>'
      +'<div><label style="font-size:12px;color:#666;font-weight:500;display:block;margin-bottom:4px">Date</label>'
      +'<input type="date" value="'+SL.date+'" onchange="SL.date=this.value" style="width:100%;font-size:14px;padding:8px 10px;border-radius:8px;border:.5px solid #d5d5d0;font-family:var(--font)"></div>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem">'
      +'<div style="padding:14px 16px;border-radius:10px;border:.5px solid #e5e5e3;background:#fafaf8">'
      +'<div style="font-size:12px;color:#666;margin-bottom:4px">Daily total</div>'
      +'<div id="sl-daily-disp" style="font-size:22px;font-weight:600;font-family:var(--mono)">'+slFmt(daily)+'</div></div>'
      +'<div style="padding:14px 16px;border-radius:10px;border:.5px solid #1D9E75;background:#fafaf8">'
      +'<div style="font-size:12px;color:#666;margin-bottom:4px">Monthly total <span style="font-size:11px;background:#E1F5EE;color:#0F6E56;padding:1px 6px;border-radius:99px;font-weight:500">'+monthLabel+'</span></div>'
      +'<div id="sl-monthly-disp" style="font-size:22px;font-weight:600;color:#0F6E56;font-family:var(--mono)">...</div>'
      +'<div style="font-size:11px;color:#aaa;margin-top:2px">'+(SL.outlet||'—')+' · from database</div></div>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:40% 20% 20% 20%;background:#fafaf8;padding:6px 8px;border-radius:6px 6px 0 0;border:.5px solid #e5e5e3;border-bottom:none">'
      +'<div style="font-size:11px;font-weight:500;color:#888">Product</div>'
      +'<div style="font-size:11px;font-weight:500;color:#888;text-align:right">Qty (nos)</div>'
      +'<div style="font-size:11px;font-weight:500;color:#888;text-align:right">Rate (excl GST) Rs</div>'
      +'<div style="font-size:11px;font-weight:500;color:#888;text-align:right">Amount Rs</div>'
      +'</div>'
      +prodHTML
      +'<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#E1F5EE;border-radius:8px;margin-bottom:1.5rem;font-weight:500">'
      +'<span>Grand total (daily)</span>'
      +'<span id="sl-daily-total" style="font-size:20px;font-weight:600;color:#0F6E56;font-family:var(--mono)">'+slFmt(daily)+'</span>'
      +'</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2rem">'
      +'<button id="sl-save-btn" onclick="slSave()" style="background:#1D9E75;color:white;border:none;padding:10px 22px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:500;font-family:var(--font)">'+(SL.editKey?'Update entry':'Save entry')+'</button>'
      +'<button onclick="SL.lines={};SL.editKey=null;renderSupplyLedger()" style="background:none;border:.5px solid #d5d5d0;color:#555;padding:10px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--font)">Clear</button>'
      +(SL.editKey?'<button onclick="SL.editKey=null;SL.lines={};renderSupplyLedger()" style="background:none;border:.5px solid #e24b4a;color:#e24b4a;padding:10px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--font)">Cancel edit</button>':'')
      +'</div>'
    :
      // HISTORY VIEW
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1.5rem;align-items:flex-end">'
      +'<div><label style="font-size:12px;color:#666;font-weight:500;display:block;margin-bottom:4px">Outlet</label>'
      +'<select onchange="SL.filterOutlet=this.value;slLoadHistory().then(function(){renderSupplyLedger();})" style="font-size:13px;padding:6px 10px;border-radius:6px;border:.5px solid #d5d5d0;font-family:var(--font)">'
      +'<option value="">All outlets</option>'+filterOptions+'</select></div>'
      +'<div><label style="font-size:12px;color:#666;font-weight:500;display:block;margin-bottom:4px">Date</label>'
      +'<input type="date" value="'+SL.filterDate+'" onchange="SL.filterDate=this.value;slLoadHistory().then(function(){renderSupplyLedger();})" style="font-size:13px;padding:6px 10px;border-radius:6px;border:.5px solid #d5d5d0;font-family:var(--font)"></div>'
      +'<button onclick="slExport()" style="font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;border:.5px solid #1D9E75;color:#0F6E56;background:none;font-family:var(--font)">Download Excel</button>'
+'<button onclick="slWhatsApp()" style="font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;border:.5px solid #25D366;color:#128C7E;background:none;font-family:var(--font)">WhatsApp</button>'+'<button onclick="SL.filterOutlet=\'\';SL.filterDate=\'\';slLoadHistory().then(function(){renderSupplyLedger();})" style="font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;border:.5px solid #d5d5d0;color:#555;background:none;font-family:var(--font)">Clear</button>'
      +'</div>'
      +histHTML
    )
    +'</div>';

  slMonthlyTotal().then(function(mt){var me=document.getElementById('sl-monthly-disp');if(me)me.textContent=slFmt(mt);});
}
</script>
</body>
</html>
